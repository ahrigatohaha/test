name: Singularity 23H Digest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Crawl 23 hours and build digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python crawl_digest.py
      - name: Upload Markdown and HTML
        uses: actions/upload-artifact@v4
        with:
          name: singularity-23h-digest
          path: output/
          if-no-files-found: error
          retention-days: 3
